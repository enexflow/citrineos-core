name: Publish citrine to npm

on:
  push:
    branches: [ env/staging, env/prod, tech-1927-npm-publish-trusted-publisher-test ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            BASE_VERSION=$(node -p "require('./package.json').version")
            echo "version=${BASE_VERSION}-fork.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install and build
        run: |
          npm install
          npm run build
 
      - name: Publish all packages
        run: bash scripts/publish-to-npm.sh ${{ steps.version.outputs.version }}
        env:
          NPM_TAG: ${{ github.ref_name == 'tech-1927-npm-publish-trusted-publisher-test' && 'prerelease' || 'prelease' }}