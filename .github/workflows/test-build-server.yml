name: Test Server on Pull Request

on:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.4.1'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and Run Docker Compose
        run: docker compose -f ${{ github.workspace }}/Server/docker-compose.yml up -d

      - name: Wait for citrine to be healthy
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' server-citrine-1 2>/dev/null || echo "starting")
            echo "Attempt $i: $status"
            if [ "$status" = "healthy" ]; then
              echo "Container is healthy!"
              exit 0
            fi
            sleep 5
          done
          echo "Container did not become healthy in time"
          exit 1

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== docker ps -a ==="
          docker ps -a
          echo "=== citrine health ==="
          docker inspect server-citrine-1 --format '{{json .State}}'
          echo "=== citrine logs ==="
          docker logs server-citrine-1
          echo "=== all service logs ==="
          docker compose -f ${{ github.workspace }}/Server/docker-compose.yml logs --no-color


      - name: Install Newman
        run: |
          npm install -g newman
          sleep 10

      - name: Integration test
        run: |
          RETRY_COUNT=0
          MAX_RETRIES=5
          RETRY_DELAY=10
          until [ $RETRY_COUNT -ge $MAX_RETRIES ]
          do
            newman run ${{ github.workspace }}/.github/workflows/tests/CI/collection.json -e ${{ github.workspace }}/.github/workflows/tests/CI/environment.json --reporters cli && break
            RETRY_COUNT=$((RETRY_COUNT+1))
            echo "Retry $RETRY_COUNT/$MAX_RETRIES in $RETRY_DELAY seconds..."
            sleep $RETRY_DELAY
          done
        shell: bash

      - name: Get logs for all containers
        if: failure()
        run: |
          docker ps -a
          docker container ls -aq | xargs -I {} docker logs {}

      - name: Clean up
        run: docker compose -f ${{ github.workspace }}/Server/docker-compose.yml down
