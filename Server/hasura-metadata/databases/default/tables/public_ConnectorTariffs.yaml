table:
  name: ConnectorTariffs
  schema: public
object_relationships:
  - name: Connector
    using:
      foreign_key_constraint_on: connectorId
  - name: Tariff
    using:
      foreign_key_constraint_on: tariffId
  - name: Tenant
    using:
      foreign_key_constraint_on: tenantId
  - name: TenantPartner
    using:
      foreign_key_constraint_on: tenantPartnerId
select_permissions:
  - role: roaming_reader
    permission:
      columns:
        - id
        - connectorId
        - tariffId
        - tenantId
        - tenantPartnerId
      filter: {}
    comment: Read-only role for the Patterm timeseries_api roaming proxy (TECH-1807); SELECT only, cross-tenant (proxy filters by partner in-query).
  - role: user
    permission:
      columns:
        - id
        - connectorOcpiId
        - tariffOcpiId
        - connectorId
        - tariffId
        - tenantId
        - tenantPartnerId
        - createdAt
        - updatedAt
      filter:
        tenantId:
          _eq: x-hasura-tenant-id
      allow_aggregations: true
    comment: ""