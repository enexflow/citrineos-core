table:
  name: Cdrs
  schema: public
object_relationships:
  - name: Tenant
    using:
      foreign_key_constraint_on: tenantId
  - name: FromTenantPartner
    using:
      foreign_key_constraint_on: fromTenantPartnerId
  - name: ToTenantPartner
    using:
      foreign_key_constraint_on: toTenantPartnerId
  - name: RoamingPartner
    using:
      foreign_key_constraint_on: roamingPartnerId
  - name: Transaction
    using:
      foreign_key_constraint_on: transactionId
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - ocpiCdrId
        - countryCode
        - partyId
        - startDateTime
        - endDateTime
        - sessionId
        - cdrToken
        - authMethod
        - authorizationReference
        - cdrLocation
        - meterId
        - currency
        - tariffs
        - chargingPeriods
        - signedData
        - totalCost
        - totalFixedCost
        - totalEnergy
        - totalEnergyCost
        - totalTime
        - totalTimeCost
        - totalParkingTime
        - totalParkingCost
        - totalReservationCost
        - remark
        - invoiceReferenceId
        - credit
        - creditReferenceId
        - homeChargingCompensation
        - lastUpdated
        - tenantId
        - roamingPartnerId
        - createdAt
        - updatedAt
        - fromTenantPartnerId
        - toTenantPartnerId
        - transactionId
        - successfullySentAt
      filter:
        tenantId:
          _eq: x-hasura-tenant-id
      allow_aggregations: true
    comment: ""