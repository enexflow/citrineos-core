# Local stand-in for the "citrine-reverse-proxy" nginx ingress that sits in
# front of citrine in prod/staging (see aws-infrastructure
# flux/clusters/base/citrineos/citrine-server-ingress.yaml), so WS proxying
# behavior (upgrade headers, long-lived connection timeouts, body size) and
# multi-instance behavior can be reproduced/tested locally.

# TECH-2191: round-robin state is per-worker; `auto` (=nproc) with few
# concurrent conns starves citrine-b, so pin to 1 worker for this local proxy.
worker_processes 1;

events {
  worker_connections 1024;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream citrine_api {
    server citrine:8080;
    server citrine-b:8080;
  }

  upstream citrine_ocpp_noauth {
    server citrine:8081;
    server citrine-b:8081;
  }

  upstream citrine_ocpp_basicauth {
    server citrine:8082;
    server citrine-b:8082;
  }

  upstream citrine_ocpp_8092 {
    server citrine:8092;
    server citrine-b:8092;
  }

  # mirrors nginx.ingress.kubernetes.io/proxy-body-size on citrine-server-ingress
  client_max_body_size 4096m;

  server {
    listen 8080;

    location / {
      proxy_pass http://citrine_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # mirrors nginx.ingress.kubernetes.io/proxy-read-timeout on citrine-server-ingress
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }

  server {
    listen 8081;

    location / {
      proxy_pass http://citrine_ocpp_noauth;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }

  server {
    listen 8082;

    location / {
      proxy_pass http://citrine_ocpp_basicauth;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }

  server {
    listen 8092;

    location / {
      proxy_pass http://citrine_ocpp_8092;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
