# Local HA overlay (TECH-2189): duplicates citrine and adds a shared redis
# cache so cross-instance cache/TTL behavior is actually exercised (not two
# isolated in-memory caches), then puts an nginx reverse proxy
# (citrine-reverse-proxy / "nginx-ws") in front of both instances as the
# local equivalent of the k8s ingress/LB (see Server/nginx-ha/nginx.conf).
#
# Usage (run from Server/), on top of the base stack:
#   docker-compose -f docker-compose.yml -f docker-compose-ha.yaml up --build
#
# The proxy is reachable on host ports 9080 (HTTP API), 9081 (OCPP ws, no
# auth) and 9082 (OCPP ws, basic auth) - separate from citrine's own
# 8980/8081/8082 so both stacks can run side by side. TLS ports (8443/8444)
# are not proxied; use the base docker-compose.yml directly for those.
#
# Note: docker-compose.swarm.yml's `redis` service builds `.redis.Dockerfile`,
# which does not exist in this repo (predates this overlay). We use the
# official `redis:7-alpine` image here instead.
services:
  redis:
    image: redis:7-alpine
    ports:
      - 6379:6379
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

  citrine:
    environment:
      CITRINEOS_UTIL_CACHE_REDIS_HOST: 'redis'
      CITRINEOS_UTIL_CACHE_REDIS_PORT: '6379'
    depends_on:
      redis:
        condition: service_healthy

  citrine-b:
    build:
      context: ../
      dockerfile: ./Server/deploy.Dockerfile
    working_dir: /usr/local/apps/citrineos
    entrypoint: ['/bin/sh', '-c']
    command:
      - 'set -e && npm run migrate && exec npm run start-docker --prefix ./Server'
    volumes:
      - ../package-lock.json:/usr/local/apps/citrineos/package-lock-host.json
      - ../package.json:/usr/local/apps/citrineos/package.json
      - ../tsconfig.json:/usr/local/apps/citrineos/tsconfig.json
      - ../tsconfig.build.json:/usr/local/apps/citrineos/tsconfig.build.json
      - ../Server:/usr/local/apps/citrineos/Server
      - ../00_Base:/usr/local/apps/citrineos/00_Base
      - ../01_Data:/usr/local/apps/citrineos/01_Data
      - ../02_Util:/usr/local/apps/citrineos/02_Util
      - ../03_Modules/Certificates:/usr/local/apps/citrineos/03_Modules/Certificates
      - ../03_Modules/Configuration:/usr/local/apps/citrineos/03_Modules/Configuration
      - ../03_Modules/EVDriver:/usr/local/apps/citrineos/03_Modules/EVDriver
      - ../03_Modules/Monitoring:/usr/local/apps/citrineos/03_Modules/Monitoring
      - ../03_Modules/OcppRouter:/usr/local/apps/citrineos/03_Modules/OcppRouter
      - ../03_Modules/Reporting:/usr/local/apps/citrineos/03_Modules/Reporting
      - ../03_Modules/SmartCharging:/usr/local/apps/citrineos/03_Modules/SmartCharging
      - ../03_Modules/Transactions:/usr/local/apps/citrineos/03_Modules/Transactions
      - ../03_Modules/Tenant:/usr/local/apps/citrineos/03_Modules/Tenant
      - /usr/local/apps/citrineos/node_modules
      - /usr/local/apps/citrineos/Server/node_modules
      - /usr/local/apps/citrineos/00_Base/node_modules
      - /usr/local/apps/citrineos/01_Data/node_modules
      - /usr/local/apps/citrineos/02_Util/node_modules
      - /usr/local/apps/citrineos/03_Modules/Certificates/node_modules
      - /usr/local/apps/citrineos/03_Modules/Configuration/node_modules
      - /usr/local/apps/citrineos/03_Modules/EVDriver/node_modules
      - /usr/local/apps/citrineos/03_Modules/Monitoring/node_modules
      - /usr/local/apps/citrineos/03_Modules/OcppRouter/node_modules
      - /usr/local/apps/citrineos/03_Modules/Reporting/node_modules
      - /usr/local/apps/citrineos/03_Modules/SmartCharging/node_modules
      - /usr/local/apps/citrineos/03_Modules/Transactions/node_modules
      - /usr/local/apps/citrineos/03_Modules/Tenant/node_modules
      - /usr/local/apps/citrineos/Server/dist/
      - /usr/local/apps/citrineos/00_Base/dist/
      - /usr/local/apps/citrineos/01_Data/dist/
      - /usr/local/apps/citrineos/02_Util/dist/
      - /usr/local/apps/citrineos/03_Modules/Certificates/dist/
      - /usr/local/apps/citrineos/03_Modules/Configuration/dist/
      - /usr/local/apps/citrineos/03_Modules/EVDriver/dist/
      - /usr/local/apps/citrineos/03_Modules/Monitoring/dist/
      - /usr/local/apps/citrineos/03_Modules/OcppRouter/dist/
      - /usr/local/apps/citrineos/03_Modules/Reporting/dist/
      - /usr/local/apps/citrineos/03_Modules/SmartCharging/dist/
      - /usr/local/apps/citrineos/03_Modules/Transactions/dist/
      - /usr/local/apps/citrineos/03_Modules/Tenant/dist/
    environment:
      APP_NAME: 'all'
      APP_ENV: 'docker'
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      DB_STRATEGY: 'migrate'
      BOOTSTRAP_CITRINEOS_DATABASE_HOST: 'ocpp-db'
      BOOTSTRAP_CITRINEOS_CONFIG_FILENAME: 'config.json'
      BOOTSTRAP_CITRINEOS_FILE_ACCESS_TYPE: 'local'
      BOOTSTRAP_CITRINEOS_FILE_ACCESS_LOCAL_DEFAULT_FILE_PATH: '/data'
      CITRINEOS_UTIL_AUTHPROVIDER_OIDC_JWKSUri: 'http://keycloak:8180/auth/realms/patterm/protocol/openid-connect/certs'
      CITRINEOS_UTIL_AUTHPROVIDER_OIDC_ISSUER: 'http://keycloak:8180/auth/realms/patterm'
      CITRINEOS_UTIL_AUTHPROVIDER_OIDC_AUDIENCE: 'citrineos'
      CITRINEOS_UTIL_AUTHPROVIDER_OIDC_RATELIMIT: 'true'
      CITRINEOS_UTIL_AUTHPROVIDER_LOCALBYPASS: 'false'
      CITRINEOS_OIDCCLIENT_TOKENURL: 'http://keycloak:8180/auth/realms/patterm/protocol/openid-connect/token'
      CITRINEOS_OIDCCLIENT_CLIENTID: 'timeseries_api'
      CITRINEOS_OIDCCLIENT_CLIENTSECRET: '1rLt3aDu9Zjgvr9aBE29h36p4igZpn0s'
      CITRINEOS_OIDCCLIENT_AUDIENCE: 'citrineos-ocpi'
      CITRINEOS_UTIL_CACHE_REDIS_HOST: 'redis'
      CITRINEOS_UTIL_CACHE_REDIS_PORT: '6379'
    depends_on:
      ocpp-db:
        condition: service_healthy
      amqp-broker:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - 8080
      - 8081
      - 8082
      - 8092
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "const net = require(\"net\"); const client = net.createConnection(8080, \"127.0.0.1\", () => { client.end(); process.exit(0); }); client.on(\"error\", () => process.exit(1)); client.setTimeout(5000, () => { client.destroy(); process.exit(1); });"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  citrine-reverse-proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx-ha/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 9080:8080
      - 9081:8081
      - 9082:8082
      - 9092:8092
    depends_on:
      citrine:
        condition: service_healthy
      citrine-b:
        condition: service_healthy
